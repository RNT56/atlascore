# Alembic configuration — AtlasCore (Postgres only).
#
# The database URL is intentionally BLANK here: env.py resolves it from the
# environment (DATABASE_URL) via atlascore Settings, so no credentials live in a
# committed file (CLAUDE.md §3, §14). Run from the repo root: `alembic upgrade head`.

[alembic]
script_location = migrations
# Timestamped, sortable revision filenames, e.g. 0002_20260603_add_crawl_job.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s
prepend_sys_path = .
# Modern path-list separator (silences Alembic's legacy-splitting DeprecationWarning,
# which pytest's filterwarnings=error would otherwise turn into a test error).
path_separator = os
# UTC timestamps in generated revisions (CLAUDE.md: UTC everywhere).
timezone = UTC
# Resolved from DATABASE_URL in env.py; left blank on purpose (no secrets in repo).
sqlalchemy.url =

[post_write_hooks]
# Keep generated revisions formatted/linted like the rest of the tree.
hooks = ruff_format ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# --- logging ---------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
