# .pre-commit-config.yaml — AtlasCore
#
# Local hooks mirror the CI quality gates (.github/workflows/ci.yml) so failures
# are caught before commit. Install once with `pre-commit install` (or `make setup`).
# Run on the whole tree with `make precommit` (== `pre-commit run --all-files`).
#
# Gates: ruff format + lint, light mypy, detect-secrets, check-yaml, check-json,
# end-of-file-fixer, trailing-whitespace.

minimum_pre_commit_version: "3.7.0"
default_language_version:
  python: python3.12

repos:
  # --- project tools: use the exact locked environment exercised by CI ----
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint (autofix)
        entry: uv run --locked --all-extras ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --all-extras ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, locked)
        entry: uv run --locked --all-extras mypy
        language: system
        pass_filenames: false

  # --- detect-secrets: block secrets/tokens from entering the repo --------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The encrypted secrets file and the example env are expected; exclude
        # them and the lockfile from the scan.
        exclude: ^(secrets\.sops\.yaml|\.env\.example|uv\.lock)$

  # --- pre-commit-hooks: hygiene ------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-yaml
        # Source registry YAML + compose + workflows must parse.
      - id: check-json
        # These fixtures deliberately exercise invalid upstream responses.
        exclude: ^tests/fixtures/(eurostat|github)/malformed\.json$
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
