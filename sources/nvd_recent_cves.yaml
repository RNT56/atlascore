# AtlasCore source registry — NVD recent CVEs (CVE 2.0 JSON API).
#
# Policy note (operator): the National Vulnerability Database is a public US
# government service; CVE data is public, so it is marked `approved` for internal
# research. This source intentionally runs the KEYLESS tier (~5 req / 30 s) —
# configured conservatively below. NVD asks clients to sleep between requests and
# pull incrementally; B20 added the runtime checkpoint cursor for that. To use the
# higher-rate keyed tier, enable `sources/nvd_recent_cves_keyed.yaml` instead.

id: nvd_recent_cves
name: NVD — recent CVEs
category: security_cve
access_method: api
base_url: https://services.nvd.nist.gov
enabled: true
policy:
  status: approved
  robots: respect
  allowed_uses: [internal_search, internal_summary, agent_retrieval]
# Keyless NVD limit: ~5 requests per 30-second rolling window.
rate_limit: { max_requests: 5, window_seconds: 30 }
freshness: { target: "24h", warn_after: "48h", error_after: "96h" }
retention: { raw: "2y", normalized: "permanent" }
credentials: { ref: null }   # keyless tier; use nvd_recent_cves_keyed.yaml for NVD_API_KEY
fetch:
  connector: atlascore.connectors.nvd.cves:NvdCveConnector
  schedule: "0 * * * *"
  timeout_seconds: 30
  params:
    results_per_page: "100"   # optional; the connector also accepts `keyword`
